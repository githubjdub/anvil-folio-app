native_deps:
  head_html: |
    <script>
    // Restore the local display choice before the first Form paints.
    (function () {
      var mode = "dark";
      try {
        mode = localStorage.getItem("portfoliora.appearance") === "light" ? "light" : "dark";
      } catch (error) {
        if (error.name !== "SecurityError" && error.name !== "QuotaExceededError") throw error;
      }
      document.documentElement.setAttribute("data-appearance", mode);
    })();
    </script>
