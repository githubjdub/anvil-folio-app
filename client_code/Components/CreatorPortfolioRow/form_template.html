<article class="creator-portfolio-row">
  <div class="creator-portfolio-copy"><anvil-component type="Label" name="name_label" bind:text="self.item['portfolio']['name']" prop:role="creator-portfolio-title" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="owner_label" bind:text="self.item['owner_email']" prop:role="creator-owner" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="tickers_label" bind:text="self.item['tickers'] or 'No securities recorded'" prop:role="creator-tickers" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><div class="creator-portfolio-facts"><anvil-component type="Label" name="transaction_count_label" bind:text="str(self.item['transaction_count']) + (' transaction' if self.item['transaction_count'] == 1 else ' transactions')" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="buy_sell_label" bind:text="str(self.item.get('buy_transaction_count', 0)) + ' buys · ' + str(self.item.get('sell_transaction_count', 0)) + ' sells'" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="as_of_label" bind:text="'As of ' + (str(self.item['portfolio']['as_of_date']) if self.item['portfolio']['as_of_date'] is not None else 'latest available prices')" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="updated_label" bind:text="'Saved ' + (self.item['portfolio']['updated_at'].strftime('%b %d, %Y %H:%M UTC') if self.item['portfolio']['updated_at'] is not None else 'date unavailable')" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div></div>
  <div class="creator-portfolio-action"><anvil-component type="Button" name="preview_button" prop:text="View transactions" prop:role="creator-tool" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Button" name="import_button" prop:text="Import a copy" prop:role="creator-action" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div>
  <section anvil:name="preview_region" class="creator-portfolio-preview" aria-label="Saved transaction preview"><anvil-component type="Label" name="preview_empty_label" bind:text="self.item.get('preview_message') or ('No transactions are recorded in this saved portfolio.' if self.item.get('preview_available', False) else 'A transaction preview is not available for this saved portfolio.')" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><div class="creator-transaction-table"><div class="creator-transaction-heading"><span>Date</span><span>Security</span><span>Action</span><span>Shares</span><span>Price / share</span></div><anvil-component type="RepeatingPanel" name="transactions_panel" prop:item_template="M3_App_1.Components.CreatorTransactionRow" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div><div anvil:name="preview_pagination" class="creator-preview-pagination"><anvil-component type="Button" name="preview_previous_button" prop:text="Previous" prop:role="creator-tool" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="preview_range_label" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Button" name="preview_next_button" prop:text="Next" prop:role="creator-tool" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div><p class="creator-preview-note">A blank price uses a market price estimate when analyzed. These are saved entries; importing creates your own copy.</p></section>
</article>
