<article class="income-security-row">
  <div class="income-row-heading"><anvil-component type="Label" name="symbol_label" bind:text="self.item['symbol']" prop:role="security-value"></anvil-component><anvil-component type="Link" name="source_link" prop:text="Finviz dividends ↗" bind:url="self.item['source_url']" prop:open_in_new_tab="true" prop:role="hedge-fund-source"></anvil-component></div>
  <div class="income-row-metrics"><div><span class="comparison-metric-label">Annual estimate</span><anvil-component type="Label" name="annual_label" bind:text="self.money(self.item['annual_income'])" prop:role="security-value"></anvil-component></div><div><span class="comparison-metric-label">Average quarter</span><anvil-component type="Label" name="quarter_label" bind:text="self.money(self.item['quarterly_average'])" prop:role="security-value"></anvil-component></div><div><span class="comparison-metric-label">Yield on cost</span><anvil-component type="Label" name="yield_label" bind:text="self.yield_text()" prop:role="security-value"></anvil-component></div></div>
  <anvil-component type="Label" name="basis_label" bind:text="self.basis_note()" prop:role="portfolio-help"></anvil-component>
</article>
