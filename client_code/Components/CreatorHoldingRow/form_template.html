<article class="creator-holding-row"><div class="creator-holding-identity"><anvil-component type="Label" name="symbol_label" bind:text="'{}. {}'.format(self.item['rank'], self.item['ticker'])" prop:role="creator-analytics-row-title"></anvil-component><anvil-component type="Label" name="company_label" bind:text="self.item['company']" prop:role="creator-caption"></anvil-component></div><div><span>Unique users</span><anvil-component type="Label" name="users_label" bind:text="str(self.item['account_count'])" prop:role="creator-monitor-value"></anvil-component></div><div><span>Market value</span><anvil-component type="Label" name="value_label" bind:text="'${:,.0f}'.format(self.item['market_value'])" prop:role="creator-monitor-value"></anvil-component><anvil-component type="Label" name="shares_label" bind:text="'{:,.3f} shares'.format(self.item['shares'])" prop:role="creator-caption"></anvil-component></div><div><span>Price / share</span><anvil-component type="Label" name="price_label" bind:text="'${:,.2f}'.format(self.item['price'])" prop:role="creator-monitor-value"></anvil-component><anvil-component type="Label" name="date_label" bind:text="self.item['price_date'].isoformat()" prop:role="creator-caption"></anvil-component></div><div><span>Avg. entered cost / share</span><anvil-component type="Label" name="cost_label" bind:text="self.display_cost()" prop:role="creator-monitor-value"></anvil-component><anvil-component type="Label" name="coverage_label" bind:text="'{:.0f}% cost coverage'.format(self.item['basis_coverage'])" prop:role="creator-caption"></anvil-component></div></article>
