<article class="creator-usage-row"><div class="creator-usage-title"><anvil-component type="Label" name="tab_label" bind:text="self.item['label']" prop:role="creator-analytics-row-title"></anvil-component><anvil-component type="Label" name="minutes_label" bind:text="'{:,.1f} min'.format(self.item['seconds'] / 60)" prop:role="creator-monitor-value"></anvil-component></div><div class="creator-usage-track"><span anvil:name="time_bar"></span></div><anvil-component type="Label" name="detail_label" bind:text="'{} users · {} opens · {:.1f}% of time · {:.0f}s / visit'.format(self.item['account_count'], self.item['views'], self.item['share'], self.item['average_seconds'])" prop:role="creator-caption"></anvil-component></article>
