<div class="creator-transaction-row"><anvil-component type="Label" name="date_label" bind:text="self.item['trade_date']" prop:role="creator-transaction-value" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="ticker_label" bind:text="self.item['ticker']" prop:role="creator-transaction-ticker" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="action_label" bind:text="self.item['action']" bind:role="'creator-transaction-sell' if self.item['action'] == 'Sell' else 'creator-transaction-buy'" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="shares_label" bind:text="self.display_shares(self.item['shares'])" prop:role='["creator-transaction-value", "privacy-value"]' prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="price_label" bind:text="self.display_price(self.item.get('trade_price'))" prop:role='["creator-transaction-value", "privacy-value"]' prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div>
