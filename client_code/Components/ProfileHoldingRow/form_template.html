<div class="profile-holding-row"><div><anvil-component type="Label" name="symbol_label" bind:text="self.item['symbol']" prop:bold="true"></anvil-component><anvil-component type="Label" name="company_label" bind:text="self.item.get('company_name', '')" prop:role="portfolio-help"></anvil-component></div><anvil-component type="Label" name="value_label" bind:text="'${:,.2f}'.format(self.item['market_value'])" prop:role="subscription-value"></anvil-component><anvil-component type="Label" name="weight_label" bind:text="'{:.1f}%'.format(self.item['weight'] * 100)" prop:role="subscription-value"></anvil-component></div>
