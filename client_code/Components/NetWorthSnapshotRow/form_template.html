<article class="nw-snapshot-row">
  <div><anvil-component type="Label" name="date_label" bind:text="str(self.item['snapshot_date'])" prop:role="nw-entry-name"></anvil-component><anvil-component type="Label" name="detail_label" bind:text="self.detail()" prop:role="[&quot;nw-caption&quot;, &quot;privacy-value&quot;]"></anvil-component></div>
  <anvil-component type="Label" name="net_label" bind:text="self.money(self.item['net_worth'])" prop:role="[&quot;nw-row-amount&quot;, &quot;privacy-value&quot;]"></anvil-component>
  <anvil-component type="Button" name="remove_button" prop:text="Remove" prop:role="nw-quiet-button" bind:tooltip="'Remove snapshot for ' + str(self.item['snapshot_date'])"></anvil-component>
</article>
