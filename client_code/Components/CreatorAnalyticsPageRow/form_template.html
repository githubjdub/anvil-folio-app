<article class="creator-analytics-row"><div class="creator-analytics-row-name"><anvil-component type="Label" name="name_label" bind:text="self.item['label']" prop:role="creator-analytics-row-title" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div><div class="creator-analytics-row-values"><anvil-component type="Label" name="count_label" bind:text="'{:,} visits · {:,} pageviews'.format(self.item['visits'], self.item['pageviews'])" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="share_label" bind:text="'{:.1f}% of selected pageviews'.format(self.item['percent'])" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div><anvil-component type="Button" name="filter_button" prop:text="Explore" prop:role="creator-analytics-filter" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></article>
