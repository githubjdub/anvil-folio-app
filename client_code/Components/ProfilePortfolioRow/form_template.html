<article class="profile-portfolio-card"><div><anvil-component type="Label" name="name_label" bind:text="self.item['name']" prop:role="profile-portfolio-title"></anvil-component><anvil-component type="Label" name="count_label" bind:text="str(len(self.item['transactions'] or [])) + ' transactions'" prop:role="portfolio-help"></anvil-component><anvil-component type="Label" name="saved_label" bind:text="'Saved ' + self.item['updated_at'].strftime('%b %d, %Y') if self.item['updated_at'] else 'Saved portfolio'" prop:role="portfolio-help"></anvil-component></div><anvil-component type="Button" name="open_button" prop:text="Open portfolio →" prop:role="subscription-button"></anvil-component></article>
