<article class="creator-directory-card">
  <div class="creator-directory-header"><div><anvil-component type="Label" name="email_label" bind:text="self.item.get('email') or 'Account without email'" prop:role="creator-directory-email" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="state_label" bind:text="'Enabled account' if self.item['enabled'] else 'Disabled account'" bind:role="'creator-account-state' if self.item['enabled'] else 'creator-account-disabled'" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div><anvil-component type="Button" name="browse_button" prop:text="Browse portfolios" prop:role="creator-tool" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div>
  <div class="creator-membership-summary">
    <anvil-component type="Label" name="membership_badge" bind:text="(self.item.get('membership') or {}).get('label', 'Free')" bind:role="'membership-badge-premium' if (self.item.get('membership') or {}).get('is_premium') else 'membership-badge-free'" prop:spacing_above="none" prop:spacing_below="none"></anvil-component>
    <anvil-component type="Label" name="membership_detail_label" bind:text="(self.item.get('membership') or {}).get('detail', 'Free access')" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component>
    <anvil-component type="Button" name="manage_membership_button" prop:text="Manage membership" prop:role="creator-tool" prop:spacing_above="none" prop:spacing_below="none"></anvil-component>
  </div>
  <section anvil:name="membership_editor" class="creator-membership-editor" aria-label="Manage account membership">
    <div class="creator-membership-fields">
      <div><label>Access level</label><anvil-component type="DropDown" name="membership_tier_dropdown" prop:role="creator-select" prop:tooltip="Account access level" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div>
      <div><label>Plus through (optional)</label><anvil-component type="DatePicker" name="membership_expiry_picker" prop:role="date-field" prop:tooltip="Last day of Plus access in UTC; leave blank for no expiry" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div>
    </div>
    <p class="creator-membership-note">Plus lasts through the selected UTC date. Leave the date blank for no expiry. Setting Free removes manual Plus access.</p>
    <p class="creator-membership-note">This changes manual access only. It does not charge the user or start or cancel a subscription.</p>
    <div class="creator-membership-actions"><anvil-component type="Button" name="membership_save_button" prop:text="Save membership" prop:role="creator-action" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Button" name="membership_cancel_button" prop:text="Cancel" prop:role="creator-tool" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div>
  </section>
  <div class="creator-directory-counts"><div><span>Saved portfolios</span><anvil-component type="Label" name="portfolio_count_label" bind:text="str(self.item['portfolio_count'])" prop:role="creator-directory-count" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div><div><span>Recorded transactions</span><anvil-component type="Label" name="transaction_count_label" bind:text="str(self.item['transaction_count'])" prop:role="creator-directory-count" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div></div>
  <div class="creator-directory-dates"><div><span>Joined</span><anvil-component type="Label" name="joined_label" bind:text="self.display_date(self.item['signed_up'])" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div><div><span>Last sign in</span><anvil-component type="Label" name="login_label" bind:text="self.display_date(self.item['last_login'])" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div><div><span>Latest portfolio save</span><anvil-component type="Label" name="latest_saved_label" bind:text="self.display_date(self.item['latest_saved_at'])" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div></div>
</article>
