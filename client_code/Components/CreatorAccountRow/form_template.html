<article class="creator-directory-card">
  <div class="creator-directory-header"><div><anvil-component type="Label" name="email_label" bind:text="self.item.get('email') or 'Account without email'" prop:role="creator-directory-email" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="state_label" bind:text="'Enabled account' if self.item['enabled'] else 'Disabled account'" bind:role="'creator-account-state' if self.item['enabled'] else 'creator-account-disabled'" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div><anvil-component type="Button" name="browse_button" prop:text="Browse portfolios" prop:role="creator-tool" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div>
  <div class="creator-directory-counts"><div><span>Saved portfolios</span><anvil-component type="Label" name="portfolio_count_label" bind:text="str(self.item['portfolio_count'])" prop:role="creator-directory-count" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div><div><span>Recorded transactions</span><anvil-component type="Label" name="transaction_count_label" bind:text="str(self.item['transaction_count'])" prop:role="creator-directory-count" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div></div>
  <div class="creator-directory-dates"><div><span>Joined</span><anvil-component type="Label" name="joined_label" bind:text="self.display_date(self.item['signed_up'])" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div><div><span>Last sign in</span><anvil-component type="Label" name="login_label" bind:text="self.display_date(self.item['last_login'])" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div><div><span>Latest portfolio save</span><anvil-component type="Label" name="latest_saved_label" bind:text="self.display_date(self.item['latest_saved_at'])" prop:role="creator-caption" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div></div>
</article>
