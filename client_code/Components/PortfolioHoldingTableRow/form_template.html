<div class="portfolio-holdings-table-row" role="row">
  <div class="portfolio-holdings-security" role="cell"><anvil-component type="Label" name="symbol_label" bind:text="self.item['symbol']" prop:role="portfolio-holdings-symbol" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="company_label" bind:text="self.item['company_name']" prop:role="portfolio-holdings-company" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="sector_label" bind:text="self.item['sector']" prop:role="portfolio-holdings-note" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div>
  <div class="portfolio-holdings-weight" role="cell"><anvil-component type="Label" name="weight_label" bind:text="self.item['weight_text']" prop:role="portfolio-holdings-number" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><div class="portfolio-holdings-weight-track"><span anvil:name="weight_fill" class="portfolio-holdings-weight-fill"></span></div></div>
  <div class="portfolio-holdings-shares" role="cell">
    <details class="portfolio-holdings-share-history">
      <summary anvil:name="history_summary"><anvil-component type="Label" name="shares_label" bind:text="self.item['shares_text']" prop:role="portfolio-holdings-number" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="RepeatingPanel" name="share_bars" prop:item_template="M3_App_1.Components.PortfolioShareBar" prop:role="portfolio-holdings-share-bars"></anvil-component><span class="portfolio-holdings-history-hint">Quarterly history</span></summary>
      <div class="portfolio-holdings-history-detail"><anvil-component type="RepeatingPanel" name="share_history" prop:item_template="M3_App_1.Components.PortfolioShareHistoryRow" prop:role="portfolio-holdings-history-rows"></anvil-component><p>Shares on each date · changes include splits</p></div>
    </details>
    <anvil-component type="Label" name="history_empty_label" prop:text="Sync for quarterly history" prop:role="portfolio-holdings-note" prop:spacing_above="none" prop:spacing_below="none"></anvil-component>
  </div>
  <div class="portfolio-holdings-basis" role="cell"><anvil-component type="Label" name="basis_label" bind:text="self.item['basis_text']" prop:role="portfolio-holdings-number" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="basis_note_label" bind:text="self.item['basis_note']" prop:role="portfolio-holdings-note" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div>
  <div role="cell"><anvil-component type="Label" name="value_label" bind:text="self.item['value_text']" prop:role="portfolio-holdings-number" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div>
  <div anvil:name="return_cell" class="portfolio-holdings-return" role="cell"><anvil-component type="Label" name="return_label" bind:text="self.item['return_text']" prop:role="portfolio-holdings-number" prop:spacing_above="none" prop:spacing_below="none"></anvil-component><anvil-component type="Label" name="return_detail_label" bind:text="self.item['return_detail']" prop:role="portfolio-holdings-note" prop:spacing_above="none" prop:spacing_below="none"></anvil-component></div>
</div>
