<article class="income-loss-row">
  <div><anvil-component type="CheckBox" name="select_checkbox" writeback:checked="self.item['selected']" bind:text="self.item['symbol']" prop:role="security-choice"></anvil-component><anvil-component type="Label" name="details_label" bind:text="self.details()" prop:role="portfolio-help"></anvil-component><anvil-component type="Label" name="values_label" bind:text="self.values()" prop:role="portfolio-help"></anvil-component><anvil-component type="Label" name="wash_label" bind:text="self.item['review_note']" prop:role="portfolio-help"></anvil-component></div>
  <div class="income-loss-value"><span class="comparison-metric-label">Unrealized loss</span><anvil-component type="Label" name="loss_label" bind:text="'−${:,.2f}'.format(self.item['potential_loss'])" prop:role="security-value"></anvil-component></div>
</article>
